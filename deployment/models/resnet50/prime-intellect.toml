name = "resnet50"
comment = """
Example deployment configuration for Prime Intellect GPU cloud.
"""

[nodes.monitor]
name = "resnet50-test1-monitor"
os = "ubuntu-22.04"
[nodes.monitor.deployment]
provider = "prime_intellect"
[nodes.monitor.deployment.config]
gpu_type = "A6000_48GB"
team_id = "cmjbklw0g001610lfmxtlul5p"
regions = ["united_states", "canada", "eu_north"]
os_prefix = "ubuntu_22"
provider_blacklist = ["runpod"]

# Single GPU worker node(s)
[nodes.gpu_node_a100]
name = "resnet50-test1-gpu-nodes"
os = "ubuntu-22.04"
[nodes.gpu_node_a100.array]
count = 4
name_template = "resnet50-test1_{array_name}"
[nodes.gpu_node_a100.deployment]
provider = "prime_intellect"
[nodes.gpu_node_a100.deployment.config]
gpu_type = "A6000_48GB"
team_id = "cmjbklw0g001610lfmxtlul5p"
regions = ["united_states", "canada", "eu_north"]
os_prefix = "ubuntu_22"
provider_blacklist = ["runpod"]

# Standalone baseline node (runs baseline training / comparison workload)
[nodes.baseline]
name = "resnet50-test1-baseline"
os = "ubuntu-22.04"
[nodes.baseline.deployment]
provider = "prime_intellect"
[nodes.baseline.deployment.config]
gpu_type = "A6000_48GB"
team_id = "cmjbklw0g001610lfmxtlul5p"
regions = ["united_states", "canada", "eu_north"]
os_prefix = "ubuntu_22"
provider_blacklist = ["runpod"]
