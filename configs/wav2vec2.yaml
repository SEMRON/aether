wandb_project: "distqat"
experiment_prefix: "wav2vec2-full"

data:
  dataset_name: "openslr/librispeech_asr"
  dataset_config: "clean"
  dataset_split: "train.100"
  # dataset_name: "nh0znoisung/timit"
  # dataset_config: "default"
  # dataset_split: "train"

  num_workers: 0
  precision: "bf16-mixed"
  task_type: "speech"
  full_model_name: "facebook/wav2vec2-base"
  sampling_rate: 16000

diloco:
  inner_optim:
    type: "adam"
    adam_lr: 1e-5
    adam_weight_decay: 0.005
    adam_betas1: 0.9
    adam_betas2: 0.95
  outer_optim:
    type: "sgd"
    sgd_lr: 0.3
    sgd_momentum: 0.9
    sgd_nesterov: True
  inner_steps: 100
  outer_steps: 100
  batch_size_per_step: 32
  min_refresh_period: 5.0
  max_refresh_period: 30.0
  verbose: true

  metadata_expiration: 900.0
  averaging_timeout: 7200.0
  target_group_size: 4
  min_group_size: 4
  min_matchmaking_time: 3600.0
  request_timeout: 30.0

network:
  expert_dht_update_period: 30.0
  expert_dht_expiration: 900.0
  metrics_expiration: 900.0

model_pipeline:
  pipeline:
    - model_name: "wav2vec2.full"
  forward_timeout: 180.0
  backward_timeout: 360.0

param_mirror:
  enable: false
  refresh_every: 30

world_size: 1
device: "cuda"
log_dir: "logs/wav2vec2_full"

checkpoint_dir: "checkpoints"
checkpoint_keep_history: false
checkpoint_update_period: 30
