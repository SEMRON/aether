wandb_project: "distqat"
experiment_prefix: "gptneo"

data:
  # dataset_name: "wikitext"
  # dataset_config: "wikitext-103-raw-v1"

  # dataset_name: "allenai/c4"
  # dataset_config: "en"

  dataset_name: "PrimeIntellect/c4-tiny"
  dataset_config: "en"

  # dataset_name: "EleutherAI/pile"
  # dataset_config: "default"

  # dataset_name: "Trelis/tiny-shakespeare"
  # dataset_config: "default"

  num_workers: 4
  precision: "bf16-mixed"
  seq_len: 1024
  task_type: "llm"
  full_model_name: "EleutherAI/gpt-neo-1.3B"
diloco:

  inner_optim:
    type: "adam"
    adam_lr: 4e-4
    adam_weight_decay: 0.1
    adam_betas1: 0.9
    adam_betas2: 0.95
    adam_epsilon: 1e-8
  outer_optim:
    type: "sgd"
    sgd_lr: 0.7
    sgd_momentum: 0.9
    sgd_nesterov: True
  scheduler: "cosine"
  num_warmup_steps: 1000
  inner_steps: 100
  outer_steps: 10000
  batch_size_per_step: 4
  gradient_accumulation_steps: 10
  
  min_refresh_period: 5.0
  max_refresh_period: 30.0

  verbose: true

  metadata_expiration: 1800.0
  averaging_timeout: 3600.0
  target_group_size: 4
  min_group_size: 2
  min_matchmaking_time: 900.0
  request_timeout: 600.0
  load_state_timeout: 1800.0


model_pipeline:
  pipeline:
    - model_name: "gptneo.head"
      hid_dim: 2048
      n_layers: 8
    - model_name: "gptneo.body"
      hid_dim: 2048
      n_layers: 8
      idx: 8
    - model_name: "gptneo.tail"
      hid_dim: 2048
      n_layers: 8
      idx: 16
  forward_timeout: 180.0
  backward_timeout: 360.0


network:
  expert_dht_update_period: 30.0
  expert_dht_expiration: 1800.0
  metrics_expiration: 1800.0

  monitor_port: 50010
  client_port: 51010
  trainer_base_port: 50110 
  server_base_hostport: 50510
  server_base_hostport_announce: 50510
  server_base_grpcport: 51510
  server_base_grpc_announceport: 51510

  hivemind_compression: "fp16and8bit"
  skip_load_from_peers: true
  skip_load_checkpoints: true

param_mirror:
  enable: false
  refresh_every: 30

world_size: 1
device: "cuda"
log_dir: "logs/gptneo"

checkpoint_dir: "checkpoints"
checkpoint_keep_history: true
checkpoint_update_period: 3600
