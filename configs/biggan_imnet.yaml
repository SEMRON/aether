wandb_project: "distqat"
experiment_prefix: "biggan-imnet"

world_size: 1
device: &device "cuda"

log_dir: "logs/biggan_imnet"


# BigGAN-specific configuration kept separate from the general schema.
# These mirror externals/biggan/utils.py parser arguments as closely as possible.
biggan: &biggan_config
  
  # Model
  model: "BigGAN"
  G_param: "SN"        # SN | SVD | None
  D_param: "SN"        # SN | SVD | None
  G_ch: 96
  D_ch: 96
  G_depth: 1
  D_depth: 1
  D_wide: true          # corresponds to --D_thin flag (dest D_wide)
  G_shared: true
  shared_dim: 0         # 0 => equals dim_z
  dim_z: 120
  z_var: 1.0
  hier: true
  cross_replica: false
  mybn: false
  G_nl: "inplace_relu"
  D_nl: "inplace_relu"
  G_attn: "64"
  D_attn: "64"
  norm_style: "bn"     # bn | in | ln | gn
  resolution: 128

  # Init, seeds
  seed: 0
  G_init: "ortho"
  D_init: "ortho"
  skip_init: false

  # Optimizer
  G_lr: 1e-4
  D_lr: 4e-4
  G_B1: 0.0
  D_B1: 0.0
  G_B2: 0.999
  D_B2: 0.999

  # Batch, parallelism, precision
  num_G_accumulations: &accumulation_steps 2
  num_D_steps: 1
  num_D_accumulations: *accumulation_steps
  split_D: false
  accumulate_stats: false
  num_standing_accumulations: 2

  # EMA
  ema: true
  ema_decay: 0.9999
  use_ema: false
  ema_start: 20000

  # Numerical precision and SV logging
  adam_eps: 1.0e-06
  BN_eps: 1.0e-05
  SN_eps: 1.0e-06
  num_G_SVs: 1
  num_D_SVs: 1
  num_G_SV_itrs: 1
  num_D_SV_itrs: 1

  batch_size: &batch_size 128

  fp16: false
  bf16: true

  device: *device

  G_eval_mode: true

  # Evaluation settings
  enable_eval: false  # Disabled for training servers - use separate evaluate.py script instead
  eval_every: 1000    # Evaluate every N optimizer steps (set to null/0 to disable)
  num_inception_images: 50000  # Number of generated images to use for IS/FID calculation
  eval_moments_file: "data/imagenet_inception_moments.npz"
# General training/runtime settings that fit the shared Config schema in src/distqat/config.py
data:
  # This section uses the generic schema; keep it minimal/general.
  dataset_name: "ILSVRC/imagenet-1k"  # Logical dataset name; BigGAN specifics go under biggan: below
  dataset_config: null
  dataset_split: "train"
  num_workers: 8
  precision: "bf16-mixed"   # Overall compute precision; BigGAN has its own fp16 flags below
  task_type: "image_gen"
  img_size: 128
  model_name: "BigGAN"

diloco:
  inner_optim:
    type: "biggan"
    biggan_G_lr: 2e-4
    biggan_D_lr: 2e-4
    biggan_G_B1: 0.0
    biggan_D_B1: 0.0
    biggan_G_B2: 0.999
    biggan_D_B2: 0.999
    biggan_adam_eps: 1.0e-06
    biggan_model_config: *biggan_config
  outer_optim:
    type: "sgd"
    sgd_lr: 0.7
    sgd_momentum: 0.0
    sgd_nesterov: false
  inner_steps: 10
  outer_steps: 1000
  batch_size_per_step: *batch_size
  gradient_accumulation_steps: *accumulation_steps
  min_refresh_period: 5.0
  max_refresh_period: 30.0


  metadata_expiration: 900.0
  averaging_timeout: 900.0
  target_group_size: 4
  min_group_size: 2
  min_matchmaking_time: 600.0
  request_timeout: 300.0

network:
  expert_dht_update_period: 30.0
  expert_dht_expiration: 1800.0
  metrics_expiration: 1800.0
  skip_load_from_peers: true
  skip_load_checkpoints: true

  hivemind_compression: "fp16"

model_pipeline:
  pipeline:
    - model_name: "biggan.full"
      num_classes: 1000
      extra: *biggan_config
  forward_timeout: 90.0
  backward_timeout: 180.0


checkpoint_dir: "checkpoints"
keep_history: true
checkpoint_update_period: 300